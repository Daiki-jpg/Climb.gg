<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Climb.gg — Piloting Services</title>

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
  color: white;
  margin: 0;
}

header {
  padding: 25px;
  background: #111;
  text-align: center;
  font-size: 32px;
  font-weight: 700;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 25px;
  padding: 30px;
}

.game-card {
  background: #1f1f1f;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  cursor: pointer;
  transition: 0.25s;
  border: 1px solid #333;
}

.game-card:hover {
  transform: scale(1.05);
  border-color: #4caf50;
}

.game-card.selected {
  border-color: #4caf50;
  box-shadow: 0 0 15px #4caf50;
}

.game-logo {
  width: 80px;
  height: 80px;
  margin-bottom: 10px;
}

.hidden { display: none; }

.panel {
  padding: 30px;
}

select, input, button {
  padding: 12px;
  margin-top: 15px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

select, input {
  width: 260px;
  background: #2a2a2a;
  color: white;
}

button {
  cursor: pointer;
  background: #4caf50;
  color: white;
  font-weight: bold;
  width: 220px;
}

button:hover { background: #45a049; }

.price-box {
  background: #161616;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
  border: 1px solid #333;
  width: 260px;
}
</style>
</head>

<body>

<header>
Climb.gg<br>
<span style="font-size:14px;font-weight:400;opacity:0.8;">
Fast • Secure • Trusted Piloting Services
</span>
</header>

<!-- GAME LIST -->
<div class="games" id="gameList">

  <div class="game-card" onclick="openPanel('ml', this)">
    <img src="images/ml.png" class="game-logo">
    <div>Mobile Legends</div>
  </div>

  <div class="game-card" onclick="openPanel('valo', this)">
    <img src="images/valo.png" class="game-logo">
    <div>Valorant</div>
  </div>

  <div class="game-card" onclick="openPanel('roblox', this)">
    <img src="images/roblox.png" class="game-logo">
    <div>Roblox</div>
  </div>

  <div class="game-card" onclick="openPanel('CODM', this)">
    <img src="images/CODM.png" class="game-logo">
    <div>CODM</div>
  </div>

</div>

<!-- ================= MOBILE LEGENDS ================= -->
<div class="panel hidden" id="ml">
<h2>Mobile Legends</h2>

<select id="mlRank" onchange="updatePrice('ml')">
  <option disabled selected>Select service</option>
  <option value="80">Epic 3 - Epic 2</option>
  <option value="80">Epic 2 - Epic 1</option>
  <option value="150">Legend 1 - Mythic</option>
  <option value="Negotiable">Mythic Stars</option>
</select>

<div class="price-box" id="mlPrice">Price: ₱---</div>

<button onclick="proceed()">Proceed</button><br>
<button onclick="goBack()">Go Back</button>
</div>

<!-- ================= VALORANT ================= -->
<div class="panel hidden" id="valo">
<h2>Valorant</h2>

<select id="valoRank" onchange="updatePrice('valo')">
  <option disabled selected>Select service</option>
  <option value="30">Iron - Bronze</option>
  <option value="50">Bronze - Silver</option>
</select>

<div class="price-box" id="valoPrice">Price: ₱---</div>

<button onclick="proceed()">Proceed</button><br>
<button onclick="goBack()">Go Back</button>
</div>

<!-- ================= ROBLOX ================= -->
<div class="panel hidden" id="roblox">
<h2>Roblox</h2>

<input id="robloxInput" placeholder="Ex: Blox Fruits Lvl 1000">

<div class="price-box">Price: Negotiable</div>

<button onclick="proceed()">Proceed</button><br>
<button onclick="goBack()">Go Back</button>
</div>

<!-- ================= CODM ================= -->
<div class="panel hidden" id="CODM">
<h2>CODM</h2>

<select id="CODMRank" onchange="updatePrice('CODM')">
  <option disabled selected>Select service</option>
  <option value="70">Elite - Pro</option>
  <option value="100">Grandmaster - Legendary</option>
</select>

<div class="price-box" id="CODMPrice">Price: ₱---</div>

<button onclick="proceed()">Proceed</button><br>
<button onclick="goBack()">Go Back</button>
</div>

<!-- ================= ORDER SUMMARY ================= -->
<div class="panel hidden" id="summary">
<h2>Order Summary</h2>

<div class="price-box">
  <p><b>Game:</b> <span id="sumGame"></span></p>
  <p><b>Service:</b> <span id="sumService"></span></p>
  <p><b>Price:</b> <span id="sumPrice"></span></p>
</div>

<button onclick="sendOrder()">Send Order</button><br>
<button onclick="goBack()">Cancel</button>
</div>

<script>
let selectedGame = "";
let selectedService = "";
let selectedPrice = "";

function hideAll() {
  document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
  document.getElementById('gameList').classList.add('hidden');
}

function openPanel(id, card) {
  selectedGame = id;

  document.querySelectorAll('.game-card').forEach(c => c.classList.remove('selected'));
  if (card) card.classList.add('selected');

  hideAll();
  document.getElementById(id).classList.remove('hidden');
}

function goBack() {
  hideAll();
  document.getElementById('gameList').classList.remove('hidden');
}

function updatePrice(game) {
  const select = document.getElementById(game + 'Rank');
  if (!select) return;

  selectedService = select.options[select.selectedIndex].text;
  selectedPrice = select.value;

  const priceBox = document.getElementById(game + 'Price');

  if (selectedPrice === "Negotiable") {
    priceBox.innerHTML = "Price: Negotiable";
  } else {
    priceBox.innerHTML = `Price: ₱${selectedPrice}`;
  }
}

function proceed() {
  if (selectedGame === "roblox") {
    selectedService = document.getElementById("robloxInput").value || "Custom request";
    selectedPrice = "Negotiable";
  }

  if (!selectedService) {
    alert("Please select a service first.");
    return;
  }

  hideAll();
  document.getElementById("summary").classList.remove('hidden');

  document.getElementById("sumGame").innerText = selectedGame.toUpperCase();
  document.getElementById("sumService").innerText = selectedService;
  document.getElementById("sumPrice").innerText =
    selectedPrice === "Negotiable" ? "Negotiable" : "₱" + selectedPrice;
}

function sendOrder() {
  let message =
`Hello Climb.gg!
I want to place an order.

Game: ${selectedGame.toUpperCase()}
Service: ${selectedService}
Price: ${selectedPrice}`;

  const facebookLink = "https://m.me/61587512906964";
  window.open(facebookLink + "?text=" + encodeURIComponent(message), "_blank");
}
</script>




</body>
</html>
