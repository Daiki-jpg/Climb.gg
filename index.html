<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Climb.gg — Piloting Services</title>

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
  color: white;
  margin: 0;
  padding: 0;
}

header {
  padding: 25px;
  background: #111;
  text-align: center;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 1px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.6);
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 25px;
  padding: 30px;
}

.game-card {
  background: #1f1f1f;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  cursor: pointer;
  transition: 0.25s;
  border: 1px solid #333;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  position: relative;
  overflow: hidden;
  animation: pulse 3s infinite;
}

.game-card:hover {
  transform: scale(1.07);
  background: #2b2b2b;
  border-color: #4caf50;
  box-shadow: 0 0 15px #4caf50, 0 0 30px rgba(76,175,80,0.5);
}

.game-card.selected {
  border-color: #4caf50;
  box-shadow: 0 0 20px #4caf50, 0 0 40px rgba(76,175,80,0.6);
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

.game-logo {
  width: 80px;
  height: 80px;
  margin-bottom: 10px;
  border-radius: 12px;
}

.hidden { display: none; }

.panel {
  padding: 30px;
  animation: fade 0.3s ease-in-out;
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

select, input, button {
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}

select, input {
  width: 250px;
  background: #2a2a2a;
  color: white;
}

button {
  cursor: pointer;
  background: #4caf50;
  color: white;
  font-weight: bold;
  transition: 0.2s;
  width: 220px;
}

button:hover { background: #45a049; }

.price-box {
  background: #161616;
  padding: 20px;
  margin-top: 20px;
  border-radius: 10px;
  border: 1px solid #333;
  width: 300px;
}
</style>
</head>

<body>

<header>
  Climb.gg<br>
  <span style="font-size:14px;font-weight:400;opacity:0.8;">
    Fast • Secure • Trusted Piloting Services
  </span>
</header>

<div class="games" id="gameList">

  <div class="game-card" onclick="openPanel('ml', this)">
    <img src="images/ml.png" class="game-logo">
    <div>Mobile Legends</div>
  </div>

  <div class="game-card" onclick="openPanel('valo', this)">
    <img src="images/valo.png" class="game-logo">
    <div>Valorant</div>
  </div>

  <div class="game-card" onclick="openPanel('roblox', this)">
    <img src="images/roblox.png" class="game-logo">
    <div>Roblox</div>
  </div>

  <div class="game-card" onclick="openPanel('CODM', this)">
    <img src="images/CODM.png" class="game-logo">
    <div>CODM</div>
  </div>

</div>

<!-- ML PANEL -->
<div class="panel hidden" id="ml">
  <h2>Mobile Legends Piloting</h2>

  <label>Select Rank:</label><br>
  <select id="mlRank" onchange="updatePrice('ml')">
    <option value="40">Warrior - Elite</option>
    <option value="50">Master - Grandmaster</option>
    <option value="75">Grandmaster - Epic</option>
    <option value="85">Epic - Legend</option>
    <option value="150">Legend - Mythic</option>
    <option value="Negotiable">Mythic 10★+</option>
  </select>

  <div class="price-box" id="mlPrice">Price: ₱---</div>

  <button onclick="proceed()">Proceed</button><br>
  <button onclick="goBack()">Go Back</button>
</div>

<!-- VALO PANEL -->
<div class="panel hidden" id="valo">
  <h2>Valorant Piloting</h2>

  <label>Select Rank:</label><br>
  <select id="valoRank" onchange="updatePrice('valo')">
    <option value="30">Iron - Bronze</option>
    <option value="50">Bronze - Silver</option>
    <option value="70">Silver - Gold</option>
  </select>

  <div class="price-box" id="valoPrice">Price: ₱---</div>

  <button onclick="proceed()">Proceed</button><br>
  <button onclick="goBack()">Go Back</button>
</div>

<!-- SOCIALS PANEL -->
<div class="panel hidden" id="socials">
  <h2>Contact Climb.gg to Proceed</h2>
  <p>Message us on any platform:</p>

  <a href="https://www.facebook.com/profile.php?id=61587512906964" target="_blank">
    <button>Facebook</button>
  </a><br>

  <a href="https://www.tiktok.com/@imdaikuku" target="_blank">
    <button>TikTok</button>
  </a><br>

  <a href="https://www.instagram.com/_daikicantaim/?hl=en" target="_blank">
    <button>Instagram</button>
  </a><br><br>

  <button onclick="returnToOffers()" style="background:#333;">
    ⬅ Return to Offers
  </button>
</div>

<script>

function openPanel(id, element) {
  document.querySelectorAll('.game-card').forEach(card => {
    card.classList.remove('selected');
  });

  element.classList.add('selected');

  document.getElementById('gameList').classList.add('hidden');
  document.getElementById(id).classList.remove('hidden');
}

function goBack() {
  document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
  document.getElementById('gameList').classList.remove('hidden');
}

function updatePrice(game) {
  const rankValue = document.getElementById(game + 'Rank').value;
  const priceBox = document.getElementById(game + 'Price');

  if (rankValue === "Negotiable") {
    priceBox.innerHTML = "Price: Negotiable";
  } else {
    priceBox.innerHTML = `Price: ₱${rankValue}`;
  }
}

function proceed() {
  localStorage.setItem("showSocials", "yes");
  location.reload();
}

function returnToOffers() {
  document.getElementById('socials').classList.add('hidden');
  document.getElementById('gameList').classList.remove('hidden');
}

window.onload = function() {
  if (localStorage.getItem("showSocials") === "yes") {
    document.getElementById('gameList').classList.add('hidden');
    document.getElementById('socials').classList.remove('hidden');
    localStorage.removeItem("showSocials");
  }
};

</script>

</body>
</html>
